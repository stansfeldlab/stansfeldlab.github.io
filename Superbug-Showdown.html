<body>
<style>
/* Layout: Gram-stain slide. Side column (stats, pathogen, drug cabinet) beside a square board; stacks to one column on phones. Single deliberate dark theme. */
:root{
  --stain:#2a1150;          /* crystal violet */
  --stain-2:#4a1c7c;
  --glass:rgba(255,255,255,.07);
  --glass-2:rgba(255,255,255,.13);
  --line:rgba(255,255,255,.16);
  --safranin:#ff5c8a;       /* counterstain accent */
  --safranin-deep:#c92a62;
  --gold:#ffcf4a;
  --ink:#fbf3ff;
  --muted:#cbb6ee;
  --good:#7ef0b0;
  --warn:#ffb36b;
  --bad:#ff7a9c;
  --card:#fdf7ff;
  --card-2:#f1e6ff;
  --card-ink:#2a1150;
  --card-muted:#6b5591;
  --font-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --font-ui:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background-color:var(--stain);background-image:radial-gradient(1100px 700px at 75% 0%,var(--stain-2),transparent 70%),radial-gradient(800px 600px at 0% 100%,rgba(255,92,138,.16),transparent 70%);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.4}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
@supports not (aspect-ratio:1/1){@media (max-width:760px){.board-wrap{height:calc(100vw - 32px)}}}
.app{height:100%;max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:14px;display:grid;gap:12px 18px;
  grid-template-columns:300px minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr) auto auto;
  grid-template-areas:"top top" "stats board" "pathogen board" "cabinet board" "cabinet treats" "cabinet ticker"}
.top{grid-area:top;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1;margin:0;color:var(--gold);text-shadow:0 3px 0 #170630;letter-spacing:.01em}
.brand span{color:var(--safranin)}
.brandwrap{display:flex;flex-direction:column;gap:3px;min-width:0}
.tagline{margin:0;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chip{font-weight:800;font-size:13px;padding:4px 12px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.spacer{flex:1}
.tally{display:inline-flex;align-items:baseline;gap:6px;font-weight:800;font-size:13px;color:var(--muted);padding:3px 12px;border-radius:999px;border:1px solid rgba(255,207,74,.35);background:rgba(255,207,74,.08);white-space:nowrap}
.tally b{font-family:var(--font-display);font-weight:400;font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums;display:inline-block}
.tally b.bump{animation:bump .45s ease}
@keyframes bump{40%{transform:scale(1.4)}}
.tally-line{margin-top:4px!important;font-size:14px}
.btn{background:var(--glass-2);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:700;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.2)}
.btn:focus-visible,.cta:focus-visible,.ghost:focus-visible,.plate:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.stats{grid-area:stats;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;min-width:0}
.stat .label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.stat .num{font-family:var(--font-display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat.moves .num{color:var(--gold)}
.stat.bugs .num{color:var(--safranin)}
.pathogen{grid-area:pathogen;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:60px minmax(0,1fr);gap:8px 12px;align-items:center}
.pathogen>img{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),rgba(255,255,255,.04))}
.pathogen h2{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0;line-height:1.05}
.latin{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.25}
.ph-rows{grid-column:1/-1;display:grid;gap:6px}
.ph-row{display:grid;grid-template-columns:74px minmax(0,1fr);gap:8px;align-items:start;font-size:13px}
.ph-row .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;padding-top:2px}
.ph-row .v{display:flex;flex-wrap:wrap;gap:4px 8px;font-weight:700}
.res{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.res img{width:16px;height:16px}
.trait{background:var(--glass-2);border-radius:999px;padding:0 8px;font-size:12px}
.cabinet{grid-area:cabinet;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:12px 14px;min-height:0;overflow:auto}
.cabinet h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 8px;font-family:var(--font-display);font-weight:400;font-size:19px}
.cabinet h3 span{font-family:var(--font-ui);font-size:12px;color:var(--muted);font-weight:800;text-align:right}
.cabinet ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.drug{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:8px}
.drug img{width:30px;height:30px}
.drug .dn{font-weight:800;line-height:1.1;display:block}
.drug .eg{font-size:12px;color:var(--muted);display:block}
.st{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st.ok{background:rgba(126,240,176,.15);color:var(--good)}
.st.part{background:rgba(255,179,107,.15);color:var(--warn)}
.st.none{background:rgba(255,122,156,.18);color:var(--bad)}
.st.off{color:var(--muted)}
.drug.is-off{opacity:.45}
.drug.is-dead .dn{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:2px}
.board-wrap{grid-area:board;position:relative;min-height:0;min-width:0}
#board{position:absolute;inset:0;margin:auto;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;border-radius:22px;outline:none;cursor:pointer}
#board:focus-visible{box-shadow:0 0 0 3px var(--gold)}
.noscript{position:absolute;inset:0;margin:0;display:grid;place-items:center;text-align:center;padding:24px;border-radius:22px;border:2px dashed var(--line);font-weight:700;font-size:17px;line-height:1.4}
.ticker{grid-area:ticker;margin:0;padding:8px 14px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid var(--line);min-height:3.4em;display:flex;flex-direction:column;justify-content:center}
.ticker .now{font-weight:700}
.ticker .prev{color:var(--muted);font-size:13px}
.modal{position:fixed;inset:0;z-index:20;display:grid;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(18,4,38,.55);overflow:auto}
.card{margin:auto;width:100%;max-width:480px;background:var(--card);color:var(--card-ink);border-radius:26px;padding:22px;box-shadow:0 0 0 4px rgba(255,255,255,.9),0 24px 60px rgba(0,0,0,.45);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.card h2{font-family:var(--font-display);font-weight:400;font-size:32px;line-height:1.05;margin:0;text-wrap:balance}
.card p{margin:0}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--safranin-deep);margin-bottom:4px!important}
.card .latin{color:var(--card-muted);font-size:14px}
.profile-head{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.portrait{width:86px;height:86px;flex:none;border-radius:50%;background:radial-gradient(circle,#f6efff,#ddc9fb);box-shadow:0 0 0 3px #fff,0 0 0 5px #e3d3fb}
.facts{display:grid;gap:6px;margin:0 0 12px;padding:10px 12px;background:var(--card-2);border-radius:14px}
.facts div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;align-items:baseline}
.facts dt{font-size:11px;font-weight:800;color:var(--card-muted);text-transform:uppercase;letter-spacing:.08em}
.facts dd{margin:0;font-weight:700;display:flex;flex-wrap:wrap;gap:2px 10px}
.tag{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--safranin-deep);margin-bottom:2px}
.block{margin-top:10px!important;line-height:1.45}
.goal{margin-top:12px!important;font-weight:800;font-size:16px}
.note{margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--card-2);line-height:1.45}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.cta{font-family:var(--font-display);font-size:20px;color:#fff;background:linear-gradient(#ff7aa2,#e3336b);border:0;border-radius:999px;padding:9px 24px;box-shadow:0 4px 0 #a51c49;cursor:pointer}
.cta:active{transform:translateY(2px);box-shadow:0 2px 0 #a51c49}
.ghost{background:var(--card-2);color:var(--card-ink);border:0;border-radius:999px;padding:9px 18px;font-weight:800;cursor:pointer}
.stars{display:flex;justify-content:center;gap:6px;margin:14px 0 6px}
.stars svg{width:52px;height:52px}
.stars svg:nth-child(2){transform:translateY(-8px);width:60px;height:60px}
.score-line{text-align:center;font-weight:700;color:var(--card-muted)}
.score-line strong{color:var(--card-ink);font-size:20px}
.plates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.plate{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:18px;border:0;background:var(--card-2);color:var(--card-ink);cursor:pointer}
.plate img{width:60px;height:60px}
.plate .pn{font-weight:800;line-height:1.1;text-align:center}
.plate .ps{color:#e0a800;letter-spacing:2px;font-size:14px}
.plate[disabled]{opacity:.45;cursor:not-allowed}
.how{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.how li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;line-height:1.35}
.how img{width:40px;height:40px}
.how b{display:block}
.research{grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:6px 12px}
.research .label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.rbar{height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.rfill{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffcf4a,#ff9f1a);border-radius:4px;transition:width .4s ease}
.rnum{font-family:var(--font-display);color:var(--gold);font-variant-numeric:tabular-nums;font-size:16px}
.treats{grid-area:treats;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.treat{display:inline-flex;align-items:center;gap:6px;padding:3px 11px 3px 4px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:12px;font-weight:800;white-space:nowrap;line-height:1.1}
.treat img{width:28px;height:28px}
.treat small{display:block;color:var(--muted);font-weight:600;font-size:11px}
.cab-note{margin:-4px 0 10px;font-size:12px;color:var(--muted);line-height:1.35}
.pbar{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:4px;overflow:hidden}
.pfill{display:block;height:100%;width:0;border-radius:3px;background:var(--good);transition:width .35s ease,background-color .35s}
.pfill.warm{background:var(--warn)}
.pfill.hot{background:var(--bad);animation:hot 1s ease-in-out infinite}
@keyframes hot{50%{opacity:.5}}
.stat.moves.low{border-color:rgba(255,122,156,.7);animation:low 1.1s ease-in-out infinite}
.stat.moves.low .num{color:var(--bad)}
@keyframes low{50%{background:rgba(255,92,138,.18)}}
@media (prefers-reduced-motion:reduce){.pfill.hot,.stat.moves.low{animation:none}}
.stew{margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--card-2);display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:center}
.stew .grade{font-family:var(--font-display);font-size:26px;line-height:1;grid-row:span 2;padding:8px 13px;border-radius:12px;color:#fff}
.grade.g-a{background:#1f9e62}.grade.g-b{background:#d08410}.grade.g-c{background:#c92a62}
.stew b{display:block;line-height:1.2}
.stew span.why{font-size:13px;color:var(--card-muted)}
.eletter{display:inline-grid;place-items:center;min-width:1.3em;height:1.3em;padding:0 .2em;margin-right:8px;border-radius:9px;background:var(--safranin);color:#fff;font-size:.78em;vertical-align:3px;box-shadow:0 2px 0 var(--safranin-deep)}
.plate .pl{font-family:var(--font-display);font-size:26px;line-height:1;color:var(--safranin-deep)}
.plate.boss{grid-column:1/-1;flex-direction:row;justify-content:center;gap:14px}
.plate.boss .pl{font-size:20px}
.plate.boss{background:linear-gradient(#ffe3ec,#ffc4d6)}
@media (max-width:760px){
  .app{height:auto;min-height:100%;grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"top" "stats" "board" "ticker" "treats" "pathogen" "cabinet"}
  .board-wrap{aspect-ratio:1/1;width:100%;max-width:100%}
  .cabinet{overflow:visible}
  .cabinet ul{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
  .drug{grid-template-columns:28px minmax(0,1fr)}
  .drug .st{grid-column:2;justify-self:start}
  .brand{font-size:26px}
  .tagline{font-size:10.5px;letter-spacing:.1em}
  .btn{padding:4px 10px;font-size:13px}
  .facts div{grid-template-columns:minmax(0,1fr);gap:0}
}

<div class="app">
  <header class="top">
    <div class="brandwrap"><h1 class="brand">Superbug <span>Showdown</span></h1><p class="tagline">Avert the Antibiotic Apocalypse</p></div>
    <span class="chip" id="level-chip">Plate 1</span>
    <span class="spacer"></span>
    <span class="tally" title="Your lifetime total on this device"><b id="tally">0</b> superbugs defeated</span>
    <button class="btn" id="sound-btn" aria-pressed="true">Sound on</button>
    <button class="btn" id="help-btn">How to play</button>
    <button class="btn" id="plates-btn">Plates</button>
    <button class="btn" id="restart-btn">Restart</button>
  </header>
  <section class="stats" aria-label="Status">
    <div class="stat moves"><span class="label">Moves</span><span class="num" id="moves">0</span></div>
    <div class="stat bugs"><span class="label">Bugs left</span><span class="num" id="bugs">0</span></div>
    <div class="stat"><span class="label">Score</span><span class="num" id="score">0</span></div>
    <div class="research" title="Kill bugs and make treatments to fund research. A full bar delivers a resistance breaker."><span class="label">Research fund</span><span class="rbar"><span class="rfill" id="rfill"></span></span><span class="rnum" id="rnum">0 / 6</span></div>
  </section>
  <section class="pathogen" id="pathogen" aria-label="Pathogen profile"></section>
  <section class="cabinet" aria-label="Drug cabinet">
    <h3>Drug cabinet <span id="useful"></span></h3>
    <p class="cab-note">Bars show selection pressure. Every match is a dose, so rotate drugs to keep them low.</p>
    <ul id="drugs"></ul>
  </section>
  <main class="board-wrap"><noscript><p class="noscript">This preview can't run games. Open the link in Safari or another browser to play.</p></noscript><canvas id="board" tabindex="0" aria-label="Game board. Swap neighbouring pills to match three or more. Arrow keys move, Space selects, then an arrow swaps."></canvas></main>
  <div class="treats" id="treats" aria-label="Treatments you can make"></div>
  <div class="ticker"><span class="now" id="tick-now" aria-live="polite"></span><span class="prev" id="tick-prev"></span></div>
</div>
<div class="modal" id="modal" hidden></div>

/* ---------------- Drawing helpers ---------------- */
function rrSub(c, x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function rrp(c, x, y, w, h, r) { c.beginPath(); rrSub(c, x, y, w, h, r); }
function shieldPath(c, x, y, s) {
  c.beginPath(); c.moveTo(x, y - s);
  c.quadraticCurveTo(x + s * 0.9, y - s * 0.8, x + s * 0.9, y - s * 0.3);
  c.quadraticCurveTo(x + s * 0.8, y + s * 0.55, x, y + s);
  c.quadraticCurveTo(x - s * 0.8, y + s * 0.55, x - s * 0.9, y - s * 0.3);
  c.quadraticCurveTo(x - s * 0.9, y - s * 0.8, x, y - s); c.closePath();
}
function radial(c, cx, cy, r, light, base, dark) {
  const gr = c.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.08, cx, cy, r);
  gr.addColorStop(0, light); gr.addColorStop(0.55, base); gr.addColorStop(1, dark); return gr;
}

function drawPill(c, color, cx, cy, s, special, t) {
  const d = DRUGS[color], u = s * 0.36;
  const rot = [-Math.PI / 4, 0, -0.35, 0, 0, Math.PI / 4][color];
  const build = () => {
    c.beginPath();
    if (color === 0) rrSub(c, -1.15 * u, -0.56 * u, 2.3 * u, 1.12 * u, 0.56 * u);
    else if (color === 1) c.arc(0, 0, 0.92 * u, 0, TAU);
    else if (color === 2) c.ellipse(0, 0, 1.06 * u, 0.74 * u, 0, 0, TAU);
    else if (color === 3) { for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + Math.PI / 6, px = Math.cos(a) * 0.98 * u, py = Math.sin(a) * 0.98 * u; if (i) c.lineTo(px, py); else c.moveTo(px, py); } c.closePath(); }
    else if (color === 4) rrSub(c, -0.6 * u, -0.42 * u, 1.2 * u, 1.38 * u, 0.32 * u);
    else rrSub(c, -0.72 * u, -0.72 * u, 1.44 * u, 1.44 * u, 0.3 * u);
  };
  c.save(); c.translate(cx, cy);
  c.save(); c.rotate(rot);
  c.lineJoin = 'round';
  c.save(); c.translate(0.05 * u, 0.12 * u); build(); c.fillStyle = 'rgba(16,0,36,.35)'; c.fill(); c.restore();
  if (color === 4) {
    rrp(c, -0.34 * u, -0.7 * u, 0.68 * u, 0.32 * u, 0.08 * u); c.fillStyle = '#d7dcea'; c.fill(); c.lineWidth = 0.08 * u; c.strokeStyle = '#4a4f66'; c.stroke();
    const cg = c.createLinearGradient(0, -1.08 * u, 0, -0.68 * u); cg.addColorStop(0, '#ffffff'); cg.addColorStop(1, '#98a1bc');
    rrp(c, -0.52 * u, -1.08 * u, 1.04 * u, 0.4 * u, 0.14 * u); c.fillStyle = cg; c.fill(); c.stroke();
  }
  build();
  const gr = c.createLinearGradient(0, -u, 0, u); gr.addColorStop(0, d.light); gr.addColorStop(0.45, d.base); gr.addColorStop(1, d.dark);
  c.fillStyle = gr; c.fill();
  if (color === 0) {
    c.save(); build(); c.clip();
    const wg = c.createLinearGradient(0, -u, 0, u); wg.addColorStop(0, '#ffffff'); wg.addColorStop(0.5, '#fff1f2'); wg.addColorStop(1, '#d9c3c7');
    c.fillStyle = wg; c.fillRect(0, -u, 1.3 * u, 2 * u); c.fillStyle = 'rgba(0,0,0,.14)'; c.fillRect(-0.04 * u, -u, 0.08 * u, 2 * u); c.restore();
  }
  c.strokeStyle = 'rgba(0,0,0,.2)'; c.lineWidth = 0.08 * u; c.lineCap = 'round';
  if (color === 1) { c.beginPath(); c.moveTo(-0.6 * u, 0.04 * u); c.lineTo(0.6 * u, 0.04 * u); c.stroke(); }
  else if (color === 5) { c.beginPath(); c.moveTo(-0.42 * u, 0); c.lineTo(0.42 * u, 0); c.moveTo(0, -0.42 * u); c.lineTo(0, 0.42 * u); c.stroke(); }
  else if (color === 4) { c.fillStyle = 'rgba(255,255,255,.82)'; c.fillRect(-0.6 * u, 0.1 * u, 1.2 * u, 0.34 * u); }
  else if (color === 3) { c.beginPath(); c.arc(0, 0, 0.5 * u, 0, TAU); c.stroke(); }
  build(); c.lineWidth = 0.1 * u; c.strokeStyle = d.line; c.stroke();
  c.save(); build(); c.clip(); c.beginPath(); c.ellipse(-0.34 * u, -0.4 * u, 0.46 * u, 0.2 * u, -0.45, 0, TAU); c.fillStyle = 'rgba(255,255,255,.6)'; c.fill(); c.restore();
  if (special === 'scanH' || special === 'scanV') {
    c.save(); build(); c.clip(); c.rotate(-rot); c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 0.15 * u;
    for (let k = -3; k <= 3; k++) { c.beginPath(); if (special === 'scanH') { c.moveTo(-2 * u, k * 0.36 * u); c.lineTo(2 * u, k * 0.36 * u); } else { c.moveTo(k * 0.36 * u, -2 * u); c.lineTo(k * 0.36 * u, 2 * u); } c.stroke(); }
    c.restore();
  }
  c.restore();
  if (special === 'scanH' || special === 'scanV') {
    const off = 1.18 * u + (RM ? 0 : Math.sin(t * 6) * 0.06 * u);
    for (const sg of [-1, 1]) {
      c.save();
      if (special === 'scanH') { c.translate(sg * off, 0); c.rotate(sg > 0 ? 0 : Math.PI); } else { c.translate(0, sg * off); c.rotate(sg > 0 ? Math.PI / 2 : -Math.PI / 2); }
      c.beginPath(); c.moveTo(0.22 * u, 0); c.lineTo(-0.1 * u, -0.2 * u); c.lineTo(-0.1 * u, 0.2 * u); c.closePath();
      c.fillStyle = '#fff'; c.fill(); c.lineWidth = 0.06 * u; c.strokeStyle = d.line; c.stroke(); c.restore();
    }
  } else if (special === 'combo') {
    c.beginPath(); c.arc(0, 0, 1.24 * u, 0, TAU); c.strokeStyle = 'rgba(255,255,255,.92)'; c.lineWidth = 0.12 * u;
    c.setLineDash([0.28 * u, 0.2 * u]); c.lineDashOffset = RM ? 0 : -t * u; c.stroke(); c.setLineDash([]);
    const bx = 0.82 * u, by = -0.82 * u;
    c.beginPath(); c.arc(bx, by, 0.34 * u, 0, TAU); c.fillStyle = '#fff'; c.fill(); c.lineWidth = 0.07 * u; c.strokeStyle = d.line; c.stroke();
    c.strokeStyle = d.dark; c.lineWidth = 0.12 * u; c.lineCap = 'round';
    c.beginPath(); c.moveTo(bx - 0.17 * u, by); c.lineTo(bx + 0.17 * u, by); c.moveTo(bx, by - 0.17 * u); c.lineTo(bx, by + 0.17 * u); c.stroke();
  } else if (special === 'vax') {
    const pr = 1.22 * u + (RM ? 0 : Math.sin(t * 5) * 0.04 * u);
    c.beginPath(); c.arc(0, 0, pr, 0, TAU); c.strokeStyle = 'rgba(150,230,255,.35)'; c.lineWidth = 0.32 * u; c.stroke();
    c.beginPath(); c.arc(0, 0, pr, 0, TAU); c.strokeStyle = '#bff0ff'; c.lineWidth = 0.09 * u; c.stroke();
    c.save(); c.translate(0.78 * u, 0.8 * u);
    c.beginPath(); c.arc(0, 0, 0.38 * u, 0, TAU); c.fillStyle = '#ffffff'; c.fill(); c.lineWidth = 0.06 * u; c.strokeStyle = '#1f6f8b'; c.stroke();
    c.rotate(-Math.PI / 4);
    rrp(c, -0.2 * u, -0.08 * u, 0.32 * u, 0.16 * u, 0.04 * u); c.fillStyle = '#9fe6ff'; c.fill(); c.lineWidth = 0.04 * u; c.strokeStyle = '#1f6f8b'; c.stroke();
    c.beginPath(); c.moveTo(-0.2 * u, 0); c.lineTo(-0.3 * u, 0); c.moveTo(-0.3 * u, -0.08 * u); c.lineTo(-0.3 * u, 0.08 * u); c.moveTo(0.12 * u, 0); c.lineTo(0.3 * u, 0); c.stroke();
    c.restore();
  }
  c.restore();
}

function drawAdjuvant(c, cx, cy, s, t) {
  const u = s * 0.36;
  c.save(); c.translate(cx, cy + (RM ? 0 : Math.sin(t * 3.2) * 0.05 * u));
  const pulse = RM ? 1 : 1 + Math.sin(t * 4) * 0.08;
  const au = c.createRadialGradient(0, 0, 0.1 * u, 0, 0, 1.35 * u * pulse); au.addColorStop(0, 'rgba(255,214,80,.65)'); au.addColorStop(1, 'rgba(255,214,80,0)');
  c.fillStyle = au; c.beginPath(); c.arc(0, 0, 1.35 * u * pulse, 0, TAU); c.fill();
  const zz = [[0, -1.2], [0.14, -0.5], [-0.1, -0.12], [0.12, 0.22], [-0.06, 0.58], [0, 1.2]];
  for (const sd of [-1, 1]) {
    c.save(); c.translate(sd * 0.11 * u, 0); c.rotate(sd * 0.08);
    c.beginPath(); c.moveTo(zz[0][0] * u, zz[0][1] * u); for (const [x, y] of zz) c.lineTo(x * u, y * u); c.lineTo(sd * 2 * u, 1.2 * u); c.lineTo(sd * 2 * u, -1.2 * u); c.closePath(); c.clip();
    shieldPath(c, 0, 0, 0.95 * u);
    const gr = c.createLinearGradient(0, -u, 0, u); gr.addColorStop(0, '#fff7d6'); gr.addColorStop(0.5, '#f5c542'); gr.addColorStop(1, '#b07a06');
    c.fillStyle = gr; c.fill(); c.lineWidth = 0.1 * u; c.strokeStyle = '#4d3200'; c.stroke();
    c.beginPath(); c.ellipse(-0.35 * u, -0.45 * u, 0.22 * u, 0.1 * u, -0.5, 0, TAU); c.fillStyle = 'rgba(255,255,255,.6)'; c.fill();
    c.restore();
  }
  c.beginPath(); c.moveTo(0.06 * u, -0.85 * u); c.lineTo(-0.14 * u, -0.02 * u); c.lineTo(0.05 * u, -0.02 * u); c.lineTo(-0.1 * u, 0.82 * u); c.lineTo(0.2 * u, -0.16 * u); c.lineTo(0.01 * u, -0.16 * u); c.lineTo(0.22 * u, -0.85 * u); c.closePath();
  c.fillStyle = '#ffffff'; c.fill(); c.lineWidth = 0.05 * u; c.strokeStyle = '#ff9f1a'; c.stroke();
  const tw = RM ? 1 : 0.6 + Math.abs(Math.sin(t * 5)) * 0.6;
  c.fillStyle = '#fff'; c.save(); c.translate(0.72 * u, -0.92 * u); c.scale(tw, tw); c.beginPath();
  c.moveTo(0, -0.2 * u); c.lineTo(0.05 * u, -0.05 * u); c.lineTo(0.2 * u, 0); c.lineTo(0.05 * u, 0.05 * u); c.lineTo(0, 0.2 * u); c.lineTo(-0.05 * u, 0.05 * u); c.lineTo(-0.2 * u, 0); c.lineTo(-0.05 * u, -0.05 * u); c.closePath(); c.fill(); c.restore();
  c.restore();
}

function drawPhage(c, cx, cy, s, t) {
  const u = s * 0.36;
  c.save(); c.translate(cx, cy + (RM ? 0 : Math.sin(t * 3) * 0.05 * u));
  const pulse = RM ? 1 : 1 + Math.sin(t * 4) * 0.08;
  const aura = c.createRadialGradient(0, -0.2 * u, 0.1 * u, 0, -0.2 * u, 1.35 * u * pulse);
  aura.addColorStop(0, 'rgba(255,120,170,.55)'); aura.addColorStop(1, 'rgba(255,120,170,0)');
  c.fillStyle = aura; c.beginPath(); c.arc(0, -0.2 * u, 1.35 * u * pulse, 0, TAU); c.fill();
  c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#1f5a6e'; c.lineWidth = 0.08 * u;
  for (const sd of [-1, 1]) for (let k = 0; k < 3; k++) {
    c.beginPath(); c.moveTo(sd * 0.12 * u, 0.9 * u); c.lineTo(sd * (0.42 + k * 0.12) * u, (1.02 + k * 0.03) * u); c.lineTo(sd * (0.52 + k * 0.16) * u, 1.26 * u); c.stroke();
  }
  rrp(c, -0.32 * u, 0.84 * u, 0.64 * u, 0.12 * u, 0.05 * u); c.fillStyle = '#9ad9e6'; c.fill(); c.stroke();
  rrp(c, -0.13 * u, 0.18 * u, 0.26 * u, 0.68 * u, 0.06 * u); c.fillStyle = '#c4ecf4'; c.fill(); c.stroke();
  c.lineWidth = 0.04 * u; for (let y = 0.3; y < 0.84; y += 0.12) { c.beginPath(); c.moveTo(-0.13 * u, y * u); c.lineTo(0.13 * u, y * u); c.stroke(); }
  c.lineWidth = 0.08 * u; rrp(c, -0.22 * u, 0.06 * u, 0.44 * u, 0.13 * u, 0.04 * u); c.fillStyle = '#9ad9e6'; c.fill(); c.stroke();
  const hy = -0.5 * u, hr = 0.62 * u;
  c.beginPath(); for (let i = 0; i < 6; i++) { const a = -Math.PI / 2 + i * Math.PI / 3; const px = Math.cos(a) * hr, py = hy + Math.sin(a) * hr; if (i) c.lineTo(px, py); else c.moveTo(px, py); } c.closePath();
  c.fillStyle = radial(c, 0, hy, hr, '#ffffff', '#8fdcec', '#3a9db8'); c.fill(); c.lineWidth = 0.08 * u; c.stroke();
  c.strokeStyle = 'rgba(31,90,110,.35)'; c.lineWidth = 0.04 * u;
  for (let i = 0; i < 6; i += 2) { const a = -Math.PI / 2 + i * Math.PI / 3; c.beginPath(); c.moveTo(0, hy); c.lineTo(Math.cos(a) * hr, hy + Math.sin(a) * hr); c.stroke(); }
  const tw = RM ? 1 : 0.6 + Math.abs(Math.sin(t * 5)) * 0.6;
  c.fillStyle = '#fff'; c.save(); c.translate(0.62 * u, -0.98 * u); c.scale(tw, tw); c.beginPath();
  c.moveTo(0, -0.2 * u); c.lineTo(0.05 * u, -0.05 * u); c.lineTo(0.2 * u, 0); c.lineTo(0.05 * u, 0.05 * u); c.lineTo(0, 0.2 * u); c.lineTo(-0.05 * u, 0.05 * u); c.lineTo(-0.2 * u, 0); c.lineTo(-0.05 * u, -0.05 * u); c.closePath(); c.fill(); c.restore();
  c.restore();
}

/* Organic membrane: superellipse with a slow wobble, so cells look alive rather than geometric */
function sePath(c, x, y, rx, ry, n, seed, t, amp, lobes = 5) {
  c.beginPath();
  const N = 34, e = 2 / n;
  for (let i = 0; i <= N; i++) {
    const a = i / N * TAU, ca = Math.cos(a), sa = Math.sin(a);
    const w = 1 + amp * (Math.sin(a * lobes + seed + t * 1.7) + 0.6 * Math.sin(a * (lobes + 2) - seed * 1.3 - t * 1.2));
    const px = x + Math.sign(ca) * Math.pow(Math.abs(ca), e) * rx * w, py = y + Math.sign(sa) * Math.pow(Math.abs(sa), e) * ry * w;
    if (i) c.lineTo(px, py); else c.moveTo(px, py);
  }
  c.closePath();
}
function shade(c, path, x, y, r, col, u) {
  path(); c.fillStyle = radial(c, x, y, r, col[0], col[1], col[2]); c.fill();
  c.save(); path(); c.clip();
  path(); c.lineWidth = Math.min(0.34 * u, r * 0.5); c.strokeStyle = 'rgba(0,0,0,.28)'; c.stroke();
  c.beginPath(); c.ellipse(x - r * 0.38, y - r * 0.42, r * 0.3, r * 0.13, -0.5, 0, TAU); c.fillStyle = 'rgba(255,255,255,.5)'; c.fill();
  c.beginPath(); c.arc(x - r * 0.08, y - r * 0.56, r * 0.05, 0, TAU); c.fill();
  c.restore();
}
function tendril(c, pts, w0, w1, color) {
  c.strokeStyle = color; c.lineCap = 'round';
  for (let i = 1; i < pts.length; i++) { c.lineWidth = w0 + (w1 - w0) * (i / (pts.length - 1)); c.beginPath(); c.moveTo(pts[i - 1][0], pts[i - 1][1]); c.lineTo(pts[i][0], pts[i][1]); c.stroke(); }
}
function blotches(c, path, list, color, u) {
  c.save(); path(); c.clip(); c.fillStyle = color;
  for (const [x, y, r] of list) { c.beginPath(); c.ellipse(x * u, y * u, r * u, r * 0.8 * u, x + y, 0, TAU); c.fill(); }
  c.restore();
}

function face(c, s, mood, blink, t = 0, taunt = false) {
  const ex = s * 0.36, ey = -s * 0.12;
  c.lineCap = 'round'; c.lineJoin = 'round';
  if (mood === 'hurt') {
    c.strokeStyle = '#14040a'; c.lineWidth = s * 0.12;
    for (const sx of [-1, 1]) { const x = sx * ex; c.beginPath(); c.moveTo(x - s * 0.12, ey - s * 0.12); c.lineTo(x + s * 0.12, ey + s * 0.12); c.moveTo(x + s * 0.12, ey - s * 0.12); c.lineTo(x - s * 0.12, ey + s * 0.12); c.stroke(); }
    c.beginPath(); c.ellipse(0, s * 0.42, s * 0.2, s * 0.17, 0, 0, TAU); c.fillStyle = '#3b0414'; c.fill(); c.lineWidth = s * 0.07; c.stroke();
    return;
  }
  for (const sx of [-1, 1]) {
    c.save(); c.translate(sx * ex, ey); c.scale(-sx, 1); c.rotate(0.3);
    const w = s * 0.27, h = blink ? s * 0.025 : s * 0.13;
    const eye = () => { c.beginPath(); c.moveTo(-w, -h * 0.2); c.quadraticCurveTo(0, -h * 1.5, w, h * 0.25); c.quadraticCurveTo(-w * 0.1, h * 1.7, -w, -h * 0.2); c.closePath(); };
    eye(); const sg = c.createRadialGradient(0, 0, 0, 0, 0, w); sg.addColorStop(0, '#fff7a8'); sg.addColorStop(0.7, '#f2cf1a'); sg.addColorStop(1, '#bf7600'); c.fillStyle = sg; c.fill();
    if (!blink) {
      c.save(); eye(); c.clip();
      c.beginPath(); c.arc(w * 0.15, h * 0.15, s * 0.1, 0, TAU); c.fillStyle = '#e3200e'; c.fill();
      c.beginPath(); c.ellipse(w * 0.15, h * 0.15, s * 0.034, s * 0.09, 0, 0, TAU); c.fillStyle = '#120205'; c.fill();
      c.beginPath(); c.arc(w * 0.15 - s * 0.045, h * 0.15 - s * 0.05, s * 0.022, 0, TAU); c.fillStyle = '#fff'; c.fill();
      c.restore();
    }
    eye(); c.lineWidth = s * 0.06; c.strokeStyle = '#14040a'; c.stroke();
    c.beginPath(); c.moveTo(-w * 1.2, -h * 0.9 - s * 0.1); c.quadraticCurveTo(0, -h * 1.9 - s * 0.13, w * 1.25, -h * 0.2 - s * 0.05); c.lineWidth = s * 0.13; c.stroke();
    c.restore();
  }
  const mw = s * 0.68, y0 = s * 0.26, yu = s * 0.4, yl = s * 0.72;
  const lip = (yc, q) => y0 + 2 * q * (1 - q) * (yc - y0), lx = q => mw / 2 * (2 * q - 1);
  const mouth = () => { c.beginPath(); c.moveTo(-mw / 2, y0); c.quadraticCurveTo(0, yu, mw / 2, y0); c.quadraticCurveTo(0, yl, -mw / 2, y0); c.closePath(); };
  mouth(); c.fillStyle = '#3b0414'; c.fill();
  c.save(); mouth(); c.clip(); c.fillStyle = '#fff4dc'; c.strokeStyle = 'rgba(60,10,20,.6)'; c.lineWidth = s * 0.02;
  for (let k = 0; k < 6; k++) { const a = k / 6, b = (k + 1) / 6, m = (a + b) / 2; c.beginPath(); c.moveTo(lx(a), lip(yu, a) - s * 0.03); c.lineTo(lx(b), lip(yu, b) - s * 0.03); c.lineTo(lx(m), lip(yu, m) + s * 0.11); c.closePath(); c.fill(); c.stroke(); }
  for (let k = 0; k < 5; k++) { const a = 0.08 + k * 0.168, b = a + 0.168, m = (a + b) / 2; c.beginPath(); c.moveTo(lx(a), lip(yl, a) + s * 0.03); c.lineTo(lx(b), lip(yl, b) + s * 0.03); c.lineTo(lx(m), lip(yl, m) - s * 0.09); c.closePath(); c.fill(); c.stroke(); }
  c.restore();
  mouth(); c.lineWidth = s * 0.07; c.strokeStyle = '#14040a'; c.stroke();
  if (taunt) {
    const tw = s * 0.15, ty = s * 0.4, tl = s * 0.34 + Math.sin(t * 10) * s * 0.03;
    c.beginPath(); c.moveTo(-tw, ty); c.lineTo(-tw, ty + tl * 0.7); c.quadraticCurveTo(-tw, ty + tl + tw * 0.4, 0, ty + tl + tw * 0.4); c.quadraticCurveTo(tw, ty + tl + tw * 0.4, tw, ty + tl * 0.7); c.lineTo(tw, ty); c.closePath();
    c.fillStyle = '#ff5f8f'; c.fill(); c.lineWidth = s * 0.05; c.strokeStyle = '#14040a'; c.stroke();
    c.beginPath(); c.moveTo(0, ty + s * 0.05); c.lineTo(0, ty + tl * 0.72); c.lineWidth = s * 0.03; c.strokeStyle = 'rgba(120,0,40,.6)'; c.stroke();
    return;
  }
  const dq = 0.78, dx = lx(dq), dy = lip(yl, dq) - s * 0.02, dl = s * (0.12 + 0.07 * (0.5 + 0.5 * Math.sin(t * 2.2)));

  c.fillStyle = '#a6ff4d'; c.fill(); c.lineWidth = s * 0.03; c.stroke();
}

const BODY = {
  mrsa(c, u, t, sd) {
    const cocci = [[-0.55, -0.38, 0.36], [0.52, -0.42, 0.38], [-0.1, -0.7, 0.3], [0.62, 0.3, 0.34], [-0.6, 0.36, 0.37], [0.12, 0.68, 0.3], [0, 0.02, 0.56]];
    const P = cocci.map(([x, y, r], i) => () => sePath(c, x * u, y * u, r * u, r * u, 2, sd + i * 1.9, t, 0.05, 4));
    c.lineJoin = 'round'; c.strokeStyle = '#2b1800'; c.lineWidth = 0.17 * u;
