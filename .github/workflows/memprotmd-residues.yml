# MemProtMD residues: every Monday (and when run by hand) gathers the per-residue contacts file of every
# simulation, rebuilds the per-group amino acid summaries the site shows (memprotmd/data/residues/) and
# publishes one parquet file of every residue as the GitHub release "memprotmd-residues". It only does the
# work when a simulation has changed since the last build; "force" rebuilds anyway.
# The script is .github/memprotmd/residues.py.
name: MemProtMD residues

on:
  schedule:
    - cron: '41 3 * * 1'   # Mondays 03:41 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if no simulation has changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: memprotmd-update
  cancel-in-progress: false

jobs:
  residues:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml==6.0.2 pyarrow==18.1.0
      - name: Build
        run: python .github/memprotmd/residues.py memprotmd build ${{ inputs.force && '--force' || '' }}
      - name: Publish the parquet file
        if: hashFiles('build/changed') != ''
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view memprotmd-residues >/dev/null 2>&1 || gh release create memprotmd-residues --title "MemProtMD residues" --notes "Every residue of every MemProtMD simulation, one row each: depth in the membrane (z, Å from the bilayer centre), secondary structure (DSSP) and the share of the simulation spent in contact with lipid heads, tails, each lipid bead, water and ions. Rebuilt when simulations change. Read it with pandas, polars, DuckDB or R arrow."
          gh release upload memprotmd-residues build/memprotmd-residues.parquet --clobber
      - name: Commit the summaries
        if: hashFiles('build/changed') != ''
        run: |
          git add -A memprotmd/data/residues .github/memprotmd/residues_state.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "MemProtMD residue summaries" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
