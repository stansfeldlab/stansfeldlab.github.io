name: memprotmd-mddb-test
on:
  push:
    branches: [memprotmd-tcdb-about]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml==6.0.2
      - run: git show HEAD:memprotmd/data/stats.json > /tmp/stats-before.json
      - run: python .github/memprotmd/update.py memprotmd
      - name: Summary
        run: |
          python3 - <<'PY'
          import json
          i = json.load(open('memprotmd/data/index.json')); m = i.get('mddb') or {}
          print('mddb entries', len(m), 'projects', sum(m.values()), 'sample', list(m.items())[:8])
          print('stats unchanged', json.load(open('memprotmd/data/stats.json')) == json.load(open('/tmp/stats-before.json')))
          PY
      - name: Commit the generated data back to this branch
        run: |
          git add -A memprotmd .github/memprotmd/rcsb.json .github/memprotmd/state.json .github/memprotmd/tcdb.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Data generated by the update job (MDDB counts)" || true
          git push
