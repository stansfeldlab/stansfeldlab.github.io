name: memprotmd-tcdb-test
on:
  push:
    branches: [memprotmd-tcdb-about]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml==6.0.2
      - name: Peek at TCDB's lists
        run: |
          for f in acc2tcid.py pdb.py families.py; do
            curl -sS -m 120 "https://www.tcdb.org/cgi-bin/projectv/public/$f" -o "/tmp/$f" -w "$f %{http_code} %{size_download}\n" || true
            echo "lines: $(wc -l < /tmp/$f)"; head -3 "/tmp/$f"; grep -m3 -E '^1\.A\s|^1\s|^1\.A\.1\s' "/tmp/$f" || true
          done
      - run: python .github/memprotmd/update.py memprotmd
      - name: Summary
        run: |
          python3 - <<'PY'
          import json, collections
          i = json.load(open('memprotmd/data/index.json')); T = i['cols']['TCDB']
          s = set(); [s.update(c[5].split()) for c in T if c[0] != 'TCDB']
          tot = collections.Counter(str(r[5])[:4] for r in i['pdb']); has = collections.Counter(str(r[5])[:4] for r in i['pdb'] if r[0] in s)
          print('entries with a TCDB family', len(s), 'of', len(i['pdb']))
          print(' '.join('%s:%d/%d' % (y, has[y], tot[y]) for y in sorted(tot) if y >= '2015'))
          new = [k for k in i['noGroupThumb'] if k.startswith('TCDB|')]
          rows = {c[0]: c for c in T}
          print('TCDB groups', len(T), 'new', len(new))
          for k in new[:40]: c = rows[k[5:]]; print(' ', c[0], '|', c[1], '|', c[2])
          print('titles starting TC', [c[0] for c in T if str(c[1]).startswith('TC ')])
          tc = json.load(open('.github/memprotmd/tcdb.json')); print({k: len(v) for k, v in tc.items()})
          PY
      - name: Commit the generated data back to this branch
        run: |
          git add -A memprotmd .github/memprotmd/rcsb.json .github/memprotmd/state.json .github/memprotmd/tcdb.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Data generated by the update job (TCDB fill-in)" || true
          git push
