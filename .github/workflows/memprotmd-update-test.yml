name: memprotmd-update-test
on:
  push:
    branches: [memprotmd-weekly]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml==6.0.2
      - name: Runs on a Friday, then Monday twice, then the next Monday
        shell: bash
        run: |
          set -e
          step() { echo "=== $1"; MEMPROTMD_TODAY=$1 GITHUB_OUTPUT=out.txt python .github/memprotmd/update.py memprotmd | grep -E 'Changed|Nothing'; cat out.txt | grep -E 'publish|cut_release|release='; rm out.txt
                   python3 -c "import json;r=json.load(open('memprotmd/data/release.json'));i=json.load(open('memprotmd/data/index.json'));print('release.json', r['release'], r['updated'], '| index', i['built'], i.get('updated'))"
                   git add -A memprotmd .github/memprotmd/state.json; git -c user.name=t -c user.email=t@t commit -qm "$1" || echo "(nothing to commit)"; }
          step 2026-11-13
          step 2026-11-16
          step 2026-11-16
          step 2026-11-23
