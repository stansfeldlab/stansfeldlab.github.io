name: memprotmd-update-test
on:
  push:
    branches: [memprotmd-weekly]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml==6.0.2
      - name: First run (as after merging)
        id: one
        run: python .github/memprotmd/update.py memprotmd
      - name: Commit locally, as the publish step would
        shell: bash
        run: |
          echo "publish=${{ steps.one.outputs.publish }} release=${{ steps.one.outputs.release }}"
          git add -A memprotmd .github/memprotmd/state.json
          git diff --cached --stat | tail -8
          git -c user.name=t -c user.email=t@t commit -qm test
      - name: Second run (as the next day)
        id: two
        run: python .github/memprotmd/update.py memprotmd
      - name: Check the second run changed nothing
        shell: bash
        run: |
          echo "publish=${{ steps.two.outputs.publish }}"
          git status --short | head; test -z "$(git status --porcelain)" && echo "working tree clean"
      - name: Dry run
        run: python .github/memprotmd/update.py memprotmd --dry-run
