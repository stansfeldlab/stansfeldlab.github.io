name: memprotmd-mpstruc-test
on:
  push:
    branches: [memprotmd-tcdb-about]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml==6.0.2
      - run: python .github/memprotmd/update.py memprotmd
      - name: Summary
        run: |
          python3 - <<'PY'
          import json, collections
          i = json.load(open('memprotmd/data/index.json')); yr = {r[0]: str(r[5])[:4] for r in i['pdb']}
          tot = collections.Counter(yr.values())
          for db in ('mpstruc', 'TCDB'):
              s = set(); [s.update(c[5].split()) for c in i['cols'][db] if c[0] != db]
              has = collections.Counter(yr[p] for p in s if p in yr)
              print(db, len(s), ' '.join('%s:%d/%d' % (y, has[y], tot[y]) for y in sorted(tot) if y >= '2017'))
          new = [k[8:] for k in i['noGroupThumb'] if k.startswith('mpstruc|')]
          rows = {c[0]: c for c in i['cols']['mpstruc']}
          print('mpstruc new groups', len(new), 'new subgroups', [ (k, rows[k][1]) for k in new if not k.startswith('protein-')][:30])
          for k in new[:12]: print('  ', k, '|', rows[k][1], '|', rows[k][3], rows[k][2])
          T = {c[0]: c for c in i['cols']['TCDB']}
          for k in ['1.A.1.2', '1.A.1.2.4', '2.A.22.1.3', '3.A.1.12.16', '1.A.1.1.1', '3.A.3.1.1']:
              if k in T: print('TCDB', k, '|', T[k][1], '|', T[k][4])
          same = sum(1 for c in T.values() if c[0].count('.') == 4 and str(c[1]).lower().startswith('the '))
          print('TCDB systems still with a family-style name', same, 'of', sum(1 for c in T.values() if c[0].count('.') == 4))
          PY
      - name: Commit the generated data back to this branch
        run: |
          git add -A memprotmd .github/memprotmd/rcsb.json .github/memprotmd/state.json .github/memprotmd/tcdb.json .github/memprotmd/mpstruc.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Data generated by the update job (mpstruc fill-in, TCDB names)" || true
          git push
