name: memprotmd-organism-test
on:
  push:
    branches: [memprotmd-organism]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml==6.0.2
      - run: python .github/memprotmd/update.py memprotmd
      - name: Summary
        run: |
          python3 - <<'PY'
          import json, collections
          i = json.load(open('memprotmd/data/index.json'))
          o = i['orgs']; rows = i['pdb']
          print('distinct organisms', len(o), '| entries without', sum(1 for r in rows if not r[6]))
          print('row example', next(r for r in rows if r[0] == '2rh1'))
          for db in ('UniProt', 'organism', 'topology', 'ligand'):
              c = i['cols'][db]; print(db, len(c), 'groups;', [(x[0], str(x[1])[:28], x[2]) for x in sorted(c, key=lambda x: -x[2]) if x[3] != 0][:9])
          import os; print('index KB', os.path.getsize('memprotmd/data/index.json') // 1024)
          PY
      - name: Commit the generated data back to this branch
        run: |
          git add -A memprotmd/data/index.json memprotmd/data/status.json memprotmd/data/groups .github/memprotmd/rcsb.json .github/memprotmd/state.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Data generated by the update job (organisms, groupings, status)"
          git push
