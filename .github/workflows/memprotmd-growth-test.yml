name: memprotmd-growth-test
on:
  push:
    branches: [memprotmd-growth]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml==6.0.2
      - run: python .github/memprotmd/update.py memprotmd
      - name: Summary
        run: |
          python3 - <<'PY'
          import json
          g = json.load(open('memprotmd/data/growth.json')); i = json.load(open('memprotmd/data/index.json'))
          y0 = g['years'][0]
          for m in ('uniprot', 'pfam'):
              print(m, g[m]['total'], 'last 6 years', list(zip(range(y0, y0 + len(g[m]['per']['all'])), g[m]['per']['all']))[-6:])
          pf = i['cols']['Pfam']; print('Pfam groups', len(pf), 'new without montage', sum(1 for k in i['noGroupThumb'] if k.startswith('Pfam|')))
          s = set(); [s.update(c[5].split()) for c in pf]
          import collections
          tot = collections.Counter(str(r[5])[:4] for r in i['pdb']); has = collections.Counter(str(r[5])[:4] for r in i['pdb'] if r[0] in s)
          print('entries with a Pfam family', ' '.join('%s:%d/%d' % (y, has[y], tot[y]) for y in sorted(tot) if y >= '2020'))
          PY
      - name: Commit the generated data back to this branch
        run: |
          git add -A memprotmd .github/memprotmd/rcsb.json .github/memprotmd/state.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Data generated by the update job (Pfam from the RCSB PDB, growth)"
          git push
