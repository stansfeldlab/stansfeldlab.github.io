name: Update publications

# Refreshes publications.html from PubMed every Monday.
# Also runs when this workflow, its script, or the Members/Alumni pages
# (whose names are shown in bold) change, or on demand from the Actions
# tab ("Run workflow").
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-publications.yml
      - .github/scripts/update_publications.py
      - members.html
      - alumni.html

permissions:
  contents: write
  pages: write

concurrency:
  group: site-bot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch papers from PubMed
        run: python3 .github/scripts/update_publications.py

      - name: Commit the refreshed page
        id: commit
        run: |
          if git diff --quiet; then
            echo "Nothing changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update publications from PubMed"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made by this workflow may not start a Pages rebuild on their own.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
