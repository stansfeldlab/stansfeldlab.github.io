name: memprotmd-probe
on:
  push:
    branches: [memprotmd-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Status data file used by the old site
        shell: bash
        run: |
          set +e
          curl -s https://memprotmd.bioch.ox.ac.uk/static/js/index.js -o /tmp/b.js
          grep -o 'fetchDataFile)("[^"]*"' /tmp/b.js | sort -u; grep -o '.\{0,120\}status.\{0,160\}' /tmp/b.js | grep -i 'fetch\|json\|yml' | head -8
      - name: Dry run
        run: python3 .github/memprotmd/update.py memprotmd --dry-run
      - name: Real run (not pushed)
        run: python3 .github/memprotmd/update.py memprotmd
      - name: What changed
        shell: bash
        run: |
          git add -A memprotmd .github/memprotmd/state.json
          git diff --cached --stat | tail -5
          git diff --cached --name-only | sed -E 's#/[^/]+$#/#' | sort | uniq -c | sort -rn | head
          for f in $(git diff --cached --name-only -- memprotmd/data/entries | head -3); do echo "== $f"; git diff --cached -- $f | head -12 | cut -c1-400; done
          echo "== index"; python3 - <<'PY'
          import json, subprocess
          new = json.load(open('memprotmd/data/index.json'))
          old = json.loads(subprocess.run(['git', 'show', 'HEAD:memprotmd/data/index.json'], capture_output=True, text=True).stdout)
          for k in new:
              if new[k] != old.get(k): print('differs:', k)
          for db in new['cols']:
              o = {c[0]: c for c in old['cols'].get(db, [])}; n = {c[0]: c for c in new['cols'][db]}
              diff = [a for a in n if a in o and n[a] != o[a]]
              print(db, 'rows', len(o), '->', len(n), 'changed', len(diff))
              for a in diff[:3]:
                  print('  old', [str(x)[:60] for x in o[a]]); print('  new', [str(x)[:60] for x in n[a]])
          print('noThumb', len(old['noThumb']), '->', len(new['noThumb']), 'noGroupThumb', len(old['noGroupThumb']), '->', len(new['noGroupThumb']))
          print('status', open('memprotmd/data/status.json').read()[:300])
          PY
