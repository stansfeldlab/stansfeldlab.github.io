<style>
/* Layout: the 3D scene fills the window; a single marker-pen card sits over it until you enter the headset. Single light theme to match the cartoon. */
:root{
  --paper:#e9ebe4;
  --card:#f8f8f4;
  --ink:#1b1d1a;
  --leaf:#4f9a17;
  --muted:#5d645a;
  --font-display:"Permanent Marker","Marker Felt","Comic Sans MS",cursive;
  --font-body:"Patrick Hand","Chalkboard SE","Comic Sans MS",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:18px;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#overlay{position:fixed;inset:0;display:grid;place-items:center;padding-block:16px;padding-inline:16px;background:rgba(233,235,228,.6)}
.card{width:100%;max-width:520px;max-height:100%;overflow:auto;background:var(--card);border:3px solid var(--ink);border-radius:18px 24px 16px 22px / 22px 16px 24px 18px;box-shadow:6px 6px 0 var(--ink);padding:22px;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0;text-wrap:balance}
p{margin:0;line-height:1.3;max-width:60ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font-family:var(--font-display);font-size:21px;color:#fff;background:var(--leaf);border:3px solid var(--ink);border-radius:14px 18px 12px 16px;box-shadow:4px 4px 0 var(--ink);padding:7px 22px;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink);font-size:18px}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--leaf);outline-offset:3px}
#status{font-size:16px;color:var(--muted)}
#reopen{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px;font-size:16px;padding:4px 14px}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
</style>

<div id="overlay">
  <div class="card" role="dialog" aria-labelledby="ttl">
    <h1 id="ttl">Don't Get Solubilised XR</h1>
    <p>Mr Membrane Protein appears on the table in front of you. Grab solutes and ions and feed them to him, swat the detergents, poke helpful lipids in the membrane and pull baddies off his legs.</p>
    <div class="row">
      <button id="btnAR" class="btn" hidden>Enter mixed reality</button>
      <button id="btnVR" class="btn" hidden>Enter VR</button>
      <button id="btnMouse" class="btn ghost">Try it with the mouse</button>
    </div>
    <p id="status">Checking for a headset…</p>
  </div>
</div>
<button id="reopen" class="btn ghost" hidden>Headset options</button>
