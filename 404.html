<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found – Stansfeld Research Group</title>
  <meta name="robots" content="noindex">
  <script>
    /* Send old or mistyped MemProtMD addresses to the right page before anything is drawn.
       Covers capital letters in /memprotmd/pdb/<code>/ (GitHub Pages addresses are case-sensitive)
       and the address patterns of the original site at memprotmd.bioch.ox.ac.uk. */
    (function () {
      var p = location.pathname, h = location.hash, M = '/memprotmd/', m, to = null;
      if ((m = p.match(/^\/memprotmd\/pdb\/([0-9a-z]{4})(\/(index\.html)?)?$/i)) && m[1] !== m[1].toLowerCase()) to = M + 'pdb/' + m[1].toLowerCase() + '/' + h;
      else if ((m = p.match(/^\/memprotmd\/_ref\/[^\/]+\/[^\/]+\/_sim\/([0-9a-z]{4})_[^\/]+\/Chain\.([^\/]+)\/?$/i)) || (m = p.match(/^\/memprotmd\/_ref\/PDB\/([0-9a-z]{4})\/Chain\.([^\/]+)\/?$/i))) to = M + '#/ref/PDB/' + m[1].toLowerCase() + '/chain/' + m[2];
      else if ((m = p.match(/^\/memprotmd\/_ref\/[^\/]+\/[^\/]+\/_sim\/([0-9a-z]{4})_[^\/]+\/?$/i)) || (m = p.match(/^\/memprotmd\/_?ref\/PDB\/([0-9a-z]{4})\/?$/i))) to = M + 'pdb/' + m[1].toLowerCase() + '/';
      else if ((m = p.match(/^\/memprotmd\/_?ref\/([^\/]+)\/([^\/]+)\/?$/))) to = M + '#/ref/' + m[1] + '/' + m[2];
      else if ((m = p.match(/^\/memprotmd\/(search\/text|stats|status|api|about|data)\/?$/))) to = M + '#/' + m[1];
      else if (/^\/memprotmd\/home\/?$/.test(p)) to = M;
      if (to) location.replace(to);
    })();
  </script>
  <link rel="icon" href="/images/2015/12/cropped-mrmembraneprotein-1.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>

  <header class="site-header" style="background-image:url('/images/2021/04/cropped-dji_0702-pano.jpg')">
    <div class="wrap">
      <a class="brand-logo" href="/" aria-label="Home"><img src="/images/2025/11/cropped-cropped-warwick-logo.jpg" alt="University of Warwick"></a>
      <div class="brand">
        <p class="brand-title"><a href="/">Stansfeld Research Group</a></p>
        <p class="brand-tag">Bringing Membrane Proteins to Life</p>
      </div>
    </div>
  </header>

  <main id="content">
    <div class="wrap">
      <h1>Page not found</h1>
      <p class="lede" id="nf-msg">There is no page at this address. It may have moved.</p>
      <p><a href="/">Go to the Stansfeld Research Group home page</a></p>
    </div>
  </main>

  <script>
    (function () {
      var m = location.pathname.match(/^\/memprotmd\/pdb\/([0-9a-z]{4})/i), el = document.getElementById('nf-msg');
      if (location.pathname.indexOf('/memprotmd/') !== 0 || !el) return;
      el.innerHTML = (m ? 'MemProtMD has no entry for PDB ' + m[1].toUpperCase() + '.' : 'There is no MemProtMD page at this address.') +
        ' <a href="/memprotmd/#/search/text' + (m ? '?q=' + m[1].toLowerCase() : '') + '">Search MemProtMD</a>.';
    })();
  </script>
</body>
</html>
