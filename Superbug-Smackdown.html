<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

<title>Superbug Smackdown</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Lilita+One&display=swap">
<style>
/* Layout: a 3x3 culture-well plate is the hero, with the drug tray under the thumb as the mallet. Side column (pathogen + field guide) on wide screens, stacked below on phones. Single deliberate dark theme shared with Superbug Showdown. */
:root{
  --stain:#2a1150;          /* crystal violet */
  --stain-2:#4a1c7c;
  --glass:rgba(255,255,255,.07);
  --glass-2:rgba(255,255,255,.13);
  --line:rgba(255,255,255,.16);
  --safranin:#ff5c8a;       /* counterstain accent */
  --safranin-deep:#c92a62;
  --gold:#ffcf4a;
  --ink:#fbf3ff;
  --muted:#cbb6ee;
  --good:#7ef0b0;
  --warn:#ffb36b;
  --bad:#ff7a9c;
  --viral:#7fe7f2;
  --card:#fdf7ff;
  --card-2:#f1e6ff;
  --card-ink:#2a1150;
  --card-muted:#6b5591;
  --font-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --font-ui:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--stain);background-image:radial-gradient(1100px 700px at 75% 0%,var(--stain-2),transparent 70%),radial-gradient(800px 600px at 0% 100%,rgba(255,92,138,.16),transparent 70%);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.4}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;display:grid;gap:12px 22px;
  grid-template-columns:290px minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto;
  grid-template-areas:"top top" "side hud" "side board" "side tray" "side ticker"}
.top{grid-area:top;display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.brandwrap{display:flex;flex-direction:column;gap:3px;min-width:0}
.brand{font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1;margin:0;color:var(--gold);text-shadow:0 3px 0 #170630;letter-spacing:.01em}
.brand span{color:var(--safranin)}
.tagline{margin:0;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chip{font-weight:800;font-size:13px;padding:4px 12px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.spacer{flex:1}
.tally{display:inline-flex;align-items:baseline;gap:6px;font-weight:800;font-size:13px;color:var(--muted);padding:3px 12px;border-radius:999px;border:1px solid rgba(255,207,74,.35);background:rgba(255,207,74,.08);white-space:nowrap}
.tally b{font-family:var(--font-display);font-weight:400;font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums;display:inline-block}
.tally b.bump{animation:bump .45s ease}
@keyframes bump{40%{transform:scale(1.4)}}
.btn{background:var(--glass-2);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:700;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.2)}
.btn:focus-visible,.cta:focus-visible,.ghost:focus-visible,.plate:focus-visible,.drug:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.side{grid-area:side;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.pathogen{display:grid;grid-template-columns:60px minmax(0,1fr);gap:8px 12px;align-items:center}
.pathogen>img{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),rgba(255,255,255,.04))}
.pathogen h2{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0;line-height:1.05}
.latin{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.25}
.ph-rows{grid-column:1/-1;display:grid;gap:6px}
.ph-row{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;align-items:start;font-size:13px}
.ph-row .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;padding-top:2px}
.ph-row .v{display:flex;flex-wrap:wrap;gap:4px 8px;font-weight:700}
.res{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.res img{width:16px;height:16px}
.trait{background:var(--glass-2);border-radius:999px;padding:0 8px;font-size:12px}
.guide h3{margin:0 0 10px;font-family:var(--font-display);font-weight:400;font-size:19px}
.guide ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.guide li{display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;align-items:center}
.guide img{width:42px;height:42px}
.guide b{display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.15}
.guide small{display:block;font-size:12.5px;color:var(--muted);line-height:1.3;margin-top:1px}
.verdict{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:1px 8px;border-radius:999px}
.verdict.whack{background:rgba(255,207,74,.16);color:var(--gold)}
.verdict.leave{background:rgba(255,122,156,.18);color:var(--bad)}
.verdict.bonus{background:rgba(126,240,176,.15);color:var(--good)}
.verdict.antiviral{background:rgba(63,208,224,.16);color:var(--viral)}

.hud{grid-area:hud;width:100%;max-width:var(--bs,100%);justify-self:center;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.2fr) minmax(0,2fr);gap:8px}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:7px 6px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.stat .num{font-family:var(--font-display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.time .num{color:var(--gold)}
.stat.time.low{border-color:rgba(255,122,156,.7);animation:low 1.1s ease-in-out infinite}
.stat.time.low .num{color:var(--bad)}
@keyframes low{50%{background:rgba(255,92,138,.18)}}
.num small{font-family:var(--font-ui);font-size:14px;font-weight:800;color:var(--gold);margin-left:4px}
.infect{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:7px 12px 18px;display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
.infect .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ival{font-family:var(--font-display);font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.ibar{position:relative;height:12px;border-radius:6px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1px var(--line)}
.ifill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px;background:var(--good);transition:width .25s ease,background-color .3s}
.ifill.warm{background:var(--warn)}
.ifill.hot{background:var(--bad)}
.mark{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:rgba(255,255,255,.65);border-radius:1px}
.mark i{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:1px;font-style:normal;font-size:10px;font-weight:800;color:var(--muted);white-space:nowrap;line-height:1.2}
.infect.bump{animation:ibump .5s ease}
@keyframes ibump{30%{background:rgba(255,92,138,.32);border-color:rgba(255,122,156,.8)}}

.board-wrap{grid-area:board;position:relative;min-height:280px;min-width:0}
#board{position:absolute;inset:0;margin:auto;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;border-radius:22px;outline:none;cursor:pointer}
.noscript{position:absolute;inset:0;margin:0;display:grid;place-items:center;text-align:center;padding:24px;border-radius:22px;border:2px dashed var(--line);font-weight:700;font-size:17px}

.tray{grid-area:tray;width:100%;max-width:var(--bs,100%);justify-self:center;display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px}
.drug{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 9px;border-radius:16px;background:var(--glass);border:1px solid var(--line);cursor:pointer;min-width:0;transition:transform .12s ease,background-color .12s}
.drug img{width:42px;height:42px;pointer-events:none}
.drug .dn{font-weight:800;font-size:12.5px;line-height:1.1;text-align:center;overflow-wrap:anywhere;hyphens:manual;pointer-events:none}
.drug .key{position:absolute;top:4px;left:8px;font-size:11px;font-weight:800;color:var(--muted);pointer-events:none}
.drug:hover{background:rgba(255,255,255,.11)}
.drug[aria-checked="true"]{background:rgba(255,207,74,.15);border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold),0 5px 0 rgba(12,0,30,.4);transform:translateY(-3px)}
.drug[aria-checked="true"] .dn{color:var(--gold)}
.pbar{display:none;width:78%;height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:4px;overflow:hidden;pointer-events:none}
.tray.pressure-on .pbar{display:block}
.pfill{display:block;height:100%;width:0;border-radius:3px;background:var(--good);transition:width .3s ease,background-color .3s}
.pfill.warm{background:var(--warn)}
.pfill.hot{background:var(--bad);animation:hot 1s ease-in-out infinite}
@keyframes hot{50%{opacity:.45}}

.ticker{grid-area:ticker;width:100%;max-width:var(--bs,100%);justify-self:center;margin:0;padding:8px 14px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid var(--line);min-height:3.4em;display:flex;flex-direction:column;justify-content:center}
.ticker .now{font-weight:700}
.ticker .prev{color:var(--muted);font-size:13px}

.modal{position:fixed;inset:0;z-index:20;display:grid;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(18,4,38,.6);overflow:auto}
.card{margin:auto;width:100%;max-width:480px;background:var(--card);color:var(--card-ink);border-radius:26px;padding:22px;box-shadow:0 0 0 4px rgba(255,255,255,.9),0 24px 60px rgba(0,0,0,.45);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:.4}to{transform:none;opacity:1}}
.card h2{font-family:var(--font-display);font-weight:400;font-size:32px;line-height:1.05;margin:0;text-wrap:balance}
.card p{margin:0}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--safranin-deep);margin-bottom:4px!important}
.card .latin{color:var(--card-muted);font-size:14px}
.profile-head{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.portrait{width:86px;height:86px;flex:none;border-radius:50%;background:radial-gradient(circle,#f6efff,#ddc9fb);box-shadow:0 0 0 3px #fff,0 0 0 5px #e3d3fb}
.facts{display:grid;gap:6px;margin:0 0 12px;padding:10px 12px;background:var(--card-2);border-radius:14px}
.facts div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;align-items:baseline}
.facts dt{font-size:11px;font-weight:800;color:var(--card-muted);text-transform:uppercase;letter-spacing:.08em}
.facts dd{margin:0;font-weight:700;display:flex;flex-wrap:wrap;gap:2px 10px}
.tag{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--safranin-deep);margin-bottom:2px}
.block{margin-top:10px!important;line-height:1.45}
.goal{margin-top:12px!important;font-weight:800;font-size:16px}
.note{margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--card-2);line-height:1.45}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.cta{font-family:var(--font-display);font-size:20px;color:#fff;background:linear-gradient(#ff7aa2,#e3336b);border:0;border-radius:999px;padding:9px 24px;box-shadow:0 4px 0 #a51c49;cursor:pointer}
.cta:active{transform:translateY(2px);box-shadow:0 2px 0 #a51c49}
.ghost{background:var(--card-2);color:var(--card-ink);border:0;border-radius:999px;padding:9px 18px;font-weight:800;cursor:pointer}
.stars{display:flex;justify-content:center;gap:6px;margin:14px 0 6px}
.stars svg{width:52px;height:52px}
.stars svg:nth-child(2){transform:translateY(-8px);width:60px;height:60px}
.score-line{text-align:center;font-weight:700;color:var(--card-muted)}
.score-line strong{color:var(--card-ink);font-size:20px}
.score-line+.score-line{margin-top:4px!important;font-size:14px}
.tallies{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}
.tallies div{background:var(--card-2);border-radius:12px;padding:6px 4px;text-align:center;line-height:1.1}
.tallies b{display:block;font-family:var(--font-display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.tallies span{font-size:11px;font-weight:800;color:var(--card-muted);text-transform:uppercase;letter-spacing:.06em}
.plates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.plate{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:18px;border:0;background:var(--card-2);color:var(--card-ink);cursor:pointer}
.plate img{width:60px;height:60px}
.plate .pn{font-weight:800;line-height:1.1;text-align:center}
.plate .ps{color:#e0a800;letter-spacing:2px;font-size:14px}
.plate .pl{font-family:var(--font-display);font-size:26px;line-height:1;color:var(--safranin-deep)}
.plate.boss{grid-column:1/-1;flex-direction:row;justify-content:center;gap:14px;background:linear-gradient(#ffe3ec,#ffc4d6)}
.plate.boss .pl{font-size:20px}
.plate[disabled]{opacity:.45;cursor:not-allowed}
.how{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.how li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;line-height:1.35}
.how img{width:40px;height:40px}
.how b{display:block}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;background:var(--card-2);border-radius:16px}
.modes-wrap{margin-top:14px}
.mode{border:0;background:transparent;border-radius:12px;padding:7px 6px;cursor:pointer;color:var(--card-ink);display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;min-width:0}
.mode b{font-family:var(--font-display);font-weight:400;font-size:18px;line-height:1.05}
.mode small{font-size:11.5px;font-weight:700;color:var(--card-muted);line-height:1.2}
.mode[aria-checked="true"]{background:#fff;box-shadow:inset 0 0 0 2px var(--safranin),0 2px 0 rgba(42,17,80,.15)}
.mode[aria-checked="true"] b{color:var(--safranin-deep)}
.mode:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.kbd{display:inline-block;font-size:12px;font-weight:800;padding:0 6px;border-radius:6px;background:var(--card-2);box-shadow:inset 0 -2px 0 #d8c6f2}
.eletter{display:inline-grid;place-items:center;min-width:1.3em;height:1.3em;padding:0 .2em;margin-right:8px;border-radius:9px;background:var(--safranin);color:#fff;font-size:.78em;vertical-align:3px;box-shadow:0 2px 0 var(--safranin-deep)}

@media (max-width:760px){
  .app{height:auto;min-height:100%;grid-template-columns:minmax(0,1fr);grid-template-rows:none;gap:10px;grid-template-areas:"top" "hud" "board" "tray" "ticker" "side"}
  .side{overflow:visible}
  .board-wrap{aspect-ratio:1/1;width:100%;max-width:100%;min-height:0}
  .brand{font-size:25px}
  .tagline{font-size:10.5px;letter-spacing:.1em}
  .btn{padding:4px 10px;font-size:13px}
  .stat .num{font-size:23px}
  .stat,.infect{border-radius:14px}
  .label{font-size:10px;letter-spacing:.1em}
  .ival{font-size:17px}
  .drug img{width:36px;height:36px}
  .drug .dn{font-size:11px}
  .facts div{grid-template-columns:minmax(0,1fr);gap:0}
  .tallies{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:400px){ .tagline{display:none} .chip{font-size:12px;padding:3px 10px} }
@media (hover:none){ .drug .key{display:none} }
@media (prefers-reduced-motion:reduce){ .card,.stat.time.low,.pfill.hot,.infect.bump,.tally b.bump{animation:none} .drug{transition:none} }
</style>

<div class="app">
  <header class="top">
    <div class="brandwrap"><h1 class="brand">Superbug <span>Smackdown</span></h1><p class="tagline">Whack the ESKAPE pathogens</p></div>
    <span class="chip" id="level-chip">Plate 1</span>
    <span class="spacer"></span>
    <span class="tally" title="Your lifetime total on this device"><b id="tally">0</b> superbugs whacked</span>
    <button class="btn" id="sound-btn" aria-pressed="true">Sound on</button>
    <button class="btn" id="help-btn">How to play</button>
    <button class="btn" id="plates-btn">Plates</button>
    <button class="btn" id="restart-btn">Restart</button>
  </header>
  <section class="hud" aria-label="Status">
    <div class="stat time"><span class="label">Time</span><span class="num" id="time">0</span></div>
    <div class="stat"><span class="label">Score</span><span class="num"><span id="score">0</span><small id="mult"></small></span></div>
    <div class="infect" id="infect"><div class="row"><span class="label">Infection</span><span class="ival" id="ival">0%</span></div>
      <div class="ibar" role="progressbar" aria-label="Infection" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="ibar"><span class="ifill" id="ifill"></span><span class="mark" style="left:20%"><i>3★</i></span><span class="mark" style="left:50%"><i>2★</i></span></div></div>
  </section>
  <aside class="side">
    <section class="panel pathogen" id="pathogen" aria-label="Pathogen profile"></section>
    <section class="panel guide" aria-label="Field guide"><h3>On this plate</h3><ul id="guide"></ul></section>
  </aside>
  <main class="board-wrap"><noscript><p class="noscript">This preview can't run games. Open the link in a browser to play.</p></noscript><canvas id="board" aria-label="Culture plate with nine wells. Bugs pop up from the wells. Tap a well to whack it with the selected drug. Keys Q W E, A S D, Z X C whack the wells."></canvas></main>
  <div class="tray" id="tray" role="radiogroup" aria-label="Choose your antibiotic"></div>
  <div class="ticker"><span class="now" id="tick-now" aria-live="polite"></span><span class="prev" id="tick-prev"></span></div>
</div>
<div class="modal" id="modal" hidden></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const canvas = $('#board'), g = canvas.getContext('2d'), wrap = $('.board-wrap'), modal = $('#modal'), app = $('.app'), tray = $('#tray');
const TAU = Math.PI * 2;
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const FINE = !!(window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches);
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const fmt = n => n.toLocaleString('en-GB');
const DF = '"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif';
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const WELL_KEYS = 'qweasdzxc';

/* ---------------- Data ---------------- */
const DRUGS = [
