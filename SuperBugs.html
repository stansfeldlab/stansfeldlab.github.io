<style>
/* Layout: one 16:9 petri-dish stage, fitted to the window, centred on deep lab green (single deliberate theme) */
:root{
  --lab-night:#10260f;
  --lab-edge:#1d3f19;
  --agar:#8fd14f;
  --label:#f2fbe8;
  --font-display:"Luckiest Guy","Arial Black",Impact,sans-serif;
  --font-ui:"Baloo 2","Trebuchet MS",system-ui,sans-serif;

}
html{height:100%;box-sizing:border-box}
body{height:100%;box-sizing:border-box;margin:0;padding-inline:16px;padding-block:16px;background-color:var(--lab-night);background-image:radial-gradient(ellipse at 50% 40%,var(--lab-edge),var(--lab-night) 72%);color:var(--label);font-family:var(--font-ui);display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{position:relative;max-width:100%}
#game{display:block;width:100%;height:100%;border-radius:18px;touch-action:none;cursor:grab;outline:none;box-shadow:0 0 0 3px rgba(143,209,79,.22),0 18px 50px rgba(0,0,0,.5)}

#game.dragging{cursor:grabbing}
</style>

<div id="stage"><canvas id="game" tabindex="0" aria-label="SuperBugs: eradicate the ESKAPE pathogens. Drag back to pull the syringe plunger, aim, and let go to fire the pill. Tap a waiting pill, or press 1 to 4, to load it instead. Tap mid-flight to use a pill's power. Escape pauses, R restarts."></canvas></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
'use strict';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const W = 1600, H = 900, G = 780, STEP = 1000 / 60, GACC = 0.001 * STEP * STEP, TAU = Math.PI * 2;
const DF = '"Luckiest Guy","Arial Black",Impact,sans-serif';
const UF = '"Baloo 2","Trebuchet MS",sans-serif';
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let scale = 1;

function fit() {
  const cs = getComputedStyle(document.body);
  const aw = document.body.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = document.body.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  let w = Math.max(200, aw), h = w * 9 / 16;
  if (h > ah && ah > 100) { h = ah; w = h * 16 / 9; }
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  scale = canvas.width / W;
}
fit();
window.addEventListener('resize', fit);
try { new ResizeObserver(fit).observe(document.body); } catch (e) {}

if (!window.Matter) {
  ctx.fillStyle = '#10260f'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#f2fbe8'; ctx.font = '20px sans-serif'; ctx.fillText('The physics engine could not load. Reload the page to try again.', 20, 40);
  return;
}
const { Engine, Bodies, Body, Composite, Events, Query } = Matter;
try { document.fonts.load('86px "Luckiest Guy"'); document.fonts.load('800 24px "Baloo 2"'); document.fonts.load('italic 700 22px "Baloo 2"'); } catch (e) {}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
function rng(seed) { let s = seed >>> 0; return () => { s += 0x6D2B79F5; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(c, x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
const fmt = n => n.toLocaleString('en-GB');
const easeOutBack = t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2);
const smooth = t => t * t * (3 - 2 * t);

/* ---------- Syringe launcher (local x runs along the barrel, origin at the stand clamp) ---------- */
const PIV = { x: 302, y: 548 };
const SY = { back: -86, front: 76, hub: 94, tip: 148, half: 26, rest: -4, fired: 62, pillX: 34, rod: 154 };
const PULL_K = 0.55, MAX_PULL = 140, POWER = 0.145, ANG_MIN = -1.3, ANG_MAX = 0.7, ANG_REST = -0.35;

/* ---------- Materials ---------- */
const MAT = {
  agar:  { density: 0.0012, friction: 0.85, restitution: 0.05, hp: 12, score: 500 },
  glass: { density: 0.0018, friction: 0.5,  restitution: 0.08, hp: 5,  score: 300 }
};

/* ---------- The superbugs: the ESKAPE pathogens ---------- */
const SPECIES = {
  ef: { name: 'E. faecium',    shape: 'circle', r: 28,        hp: 5,  gen: 3, lt: '#d2b0f7', col: '#9b59d6', dk: '#6e32ab', ln: '#4b1c7d' },
  sa: { name: 'S. aureus',     shape: 'circle', r: 28,        hp: 5,  gen: 2, lt: '#ffe98a', col: '#f2b72a', dk: '#d48f16', ln: '#94650c' },
  kp: { name: 'K. pneumoniae', shape: 'rod',    w: 42, h: 62, hp: 7,  gen: 2, lt: '#f9b6d6', col: '#e46aa7', dk: '#b83f7c', ln: '#7d2453' },
  ab: { name: 'A. baumannii',  shape: 'rod',    w: 46, h: 50, hp: 6,  gen: 3, lt: '#fbf1d6', col: '#e2cc94', dk: '#bfa368', ln: '#7f6a3c' },
  pa: { name: 'P. aeruginosa', shape: 'rod',    w: 40, h: 66, hp: 12, gen: 3, lt: '#8fcaf7', col: '#3b8ad6', dk: '#2864a8', ln: '#1d4c80' },
  ec: { name: 'E. cloacae',    shape: 'rod',    w: 42, h: 58, hp: 6,  gen: 2, lt: '#ffb199', col: '#e2583a', dk: '#b83a22', ln: '#7d2312' }
};
/* Strains get tougher plate by plate. S = susceptible, I = intermediate, R = resistant (intrinsic or acquired). */
const S = 1, I = 0.5, R = 0.05;
const STRAINS = {
  pssa: { sp: 'sa', nick: 'PEN-S', sus: { amx: S, amc: S, van: S, mem: S, lzd: S, cst: R, fdc: R } },
  mssa: { sp: 'sa', nick: 'MSSA',  sus: { amx: R, amc: S, van: S, mem: S, lzd: S, cst: R, fdc: R } },
  mrsa: { sp: 'sa', nick: 'MRSA',  sus: { amx: R, amc: R, van: S, mem: R, lzd: S, cst: R, fdc: R } },
  efs:  { sp: 'ef', nick: '',      sus: { amx: S, amc: S, van: S, mem: R, lzd: S, cst: R, fdc: R } },
  vre:  { sp: 'ef', nick: 'VRE',   sus: { amx: R, amc: R, van: R, mem: R, lzd: S, cst: R, fdc: R } },
  kp:   { sp: 'kp', nick: '',      sus: { amx: R, amc: S, van: R, mem: S, lzd: R, cst: S, fdc: S } },
  esbl: { sp: 'kp', nick: 'ESBL',  sus: { amx: R, amc: R, van: R, mem: S, lzd: R, cst: S, fdc: S } },
  kpc:  { sp: 'kp', nick: 'KPC',   sus: { amx: R, amc: R, van: R, mem: R, lzd: R, cst: S, fdc: S } },
  crab: { sp: 'ab', nick: 'CRAB',  sus: { amx: R, amc: R, van: R, mem: R, lzd: R, cst: S, fdc: S } },
  pa:   { sp: 'pa', nick: '',      sus: { amx: R, amc: R, van: R, mem: S, lzd: R, cst: S, fdc: S } },
  mdr:  { sp: 'pa', nick: 'MDR',   sus: { amx: R, amc: R, van: R, mem: R, lzd: R, cst: S, fdc: S } },
  ec:   { sp: 'ec', nick: 'AmpC',  sus: { amx: R, amc: R, van: R, mem: S, lzd: R, cst: I, fdc: S } }
};
const PHYS = 0.4;      // crushing damage to bugs from blocks and falls (drugs do the real work)
const MUT = 0.2;       // one surviving exposure or mutation cuts a drug's effect to a fifth
const SPONT = 0.3;     // chance a daughter cell carries a fresh resistance mutation
const MAX_BUGS = 10;
const TIER_COL = { S: '#2e9d3a', I: '#e3a21a', R: '#d8322b' };

/* ---------- Antibiotics, from first line to last resort (WHO AWaRe groups) ---------- */
const AWARE = { access: { t: 'ACCESS', c: '#2e9d3a' }, watch: { t: 'WATCH', c: '#e0901a' }, reserve: { t: 'RESERVE', c: '#d8322b' } };
const PILLS = {
  amx: { name: 'AMOXICILLIN',  abbr: 'AMX', aware: 'access',  cls: 'Penicillin · the usual first-line choice',              power: null,    shape: 'cap', w: 76, h: 40, a: '#f6d24a', b: '#9c2333', density: 0.004 },
  amc: { name: 'CO-AMOXICLAV', abbr: 'AMC', aware: 'access',  cls: 'Amoxicillin + clavulanate · blocks β-lactamase · tap to split', power: 'split', shape: 'cap', w: 72, h: 38, a: '#f7f7f7', b: '#8ec3ea', density: 0.0032 },
  van: { name: 'VANCOMYCIN',   abbr: 'VAN', aware: 'watch',   cls: 'Glycopeptide · Gram-positives, including MRSA',         power: null,    shape: 'cap', w: 76, h: 40, a: '#f7f5f1', b: '#e3342b', density: 0.004 },
  mem: { name: 'MEROPENEM',    abbr: 'MEM', aware: 'watch',   cls: 'Carbapenem · broad spectrum · tap to split',             power: 'split', shape: 'cap', w: 74, h: 40, a: '#fff3df', b: '#f2902a', density: 0.0034 },
  lzd: { name: 'LINEZOLID',    abbr: 'LZD', aware: 'reserve', cls: 'Oxazolidinone · MRSA and VRE · tap to dash',             power: 'dash',  shape: 'cap', w: 72, h: 38, a: '#2f7fd8', b: '#f1f4f6', density: 0.0036 },
  cst: { name: 'COLISTIN',     abbr: 'CST', aware: 'reserve', cls: 'Polymyxin of last resort · Gram-negatives · tap to burst', power: 'fizz', shape: 'tab', r: 27, a: '#eef2f3', b: '#aebbc0', density: 0.004 },
  fdc: { name: 'CEFIDEROCOL',  abbr: 'FDC', aware: 'reserve', cls: 'Siderophore "Trojan horse" · Gram-negatives · tap to dash', power: 'dash', shape: 'tab', r: 26, a: '#f8c631', b: '#d4950f', density: 0.0042 }
};
const TAP_HINT = { split: 'TAP TO SPLIT', dash: 'TAP FOR A SPEED BURST', fizz: 'TAP TO BURST THE MEMBRANES' };
const halfLen = t => PILLS[t].shape === 'cap' ? PILLS[t].w / 2 : PILLS[t].r;
const QX0 = 210, QDX = 56;

/* ---------- Plates: escalating from first line to last resort ---------- */
const LEVELS = [
  { id: '1-1', pills: ['amx', 'amx', 'amx'],
    brief: ['First line: amoxicillin still kills this S. aureus', 'Badges: S susceptible · I intermediate · R resistant · ×2 divides after this shot'],
    build(L) {
      L.box(1150, G, 30, 140, 'agar'); L.box(1310, G, 30, 140, 'agar'); L.box(1230, G - 140, 220, 22, 'glass');
      L.bug('pssa', 1230, G); L.bug('pssa', 1230, G - 162);
  } },
  { id: '1-2', pills: ['amx', 'amc', 'amc'],
    brief: ['β-lactamase enzymes wreck amoxicillin; co-amoxiclav blocks them', 'Tap a waiting pill (or press 1–4) to load it instead'],
    build(L) {
      L.box(1080, G, 70, 70, 'agar'); L.box(1080, G - 70, 70, 70, 'agar'); L.bug('efs', 1080, G - 140);
      L.box(1170, G, 22, 100, 'glass'); L.box(1270, G, 22, 100, 'glass'); L.box(1220, G - 100, 140, 20, 'glass'); L.bug('kp', 1220, G);
      L.box(1400, G, 70, 70, 'agar'); L.box(1400, G - 70, 70, 70, 'agar'); L.box(1400, G - 140, 70, 70, 'agar'); L.bug('mssa', 1400, G - 210);
  } },
  { id: '1-3', pills: ['mem', 'van', 'mem', 'mem', 'van'],
    brief: ['MRSA resists every β-lactam; vancomycin still works', 'ESBL and AmpC Gram-negatives need a carbapenem'],
    build(L) {
      for (const x of [1050, 1190, 1330, 1470]) L.box(x, G, 70, 70, 'agar');
      L.box(1260, G, 40, 40, 'glass');
      L.bug('esbl', 1120, G); L.bug('ec', 1400, G); L.bug('pa', 1260, G - 40);
      L.box(1120, G - 70, 210, 20, 'glass'); L.box(1400, G - 70, 210, 20, 'glass');
      L.box(1120, G - 90, 70, 70, 'agar'); L.box(1400, G - 90, 70, 70, 'agar');
      L.box(1260, G - 160, 360, 20, 'glass');
      L.bug('mrsa', 1260, G - 180);
  } },
  { id: '1-4', pills: ['lzd', 'mem', 'cst', 'mem'],
    brief: ['VRE shrugs off vancomycin; linezolid is held in reserve for it', 'CRAB beats carbapenems; colistin is the last resort'],
    build(L) {
      L.box(1060, G, 70, 70, 'agar'); L.box(1060, G - 70, 70, 70, 'agar'); L.bug('crab', 1060, G - 140);
      L.box(1180, G, 24, 150, 'glass'); L.box(1320, G, 24, 150, 'glass'); L.box(1250, G - 150, 180, 30, 'agar');
      L.bug('pa', 1250, G); L.flask(1250, G - 180, 90, 90);
      L.box(1450, G, 70, 70, 'agar'); L.box(1450, G - 70, 70, 70, 'agar'); L.bug('vre', 1450, G - 140);
  } },
  { id: '1-5', pills: ['lzd', 'cst', 'fdc', 'fdc', 'lzd'],
    brief: ['Final plate: all six ESKAPE superbugs at their worst', 'Only the antibiotics of last resort are left'],
    build(L) {
      L.box(1120, G, 70, 70, 'agar'); L.bug('kpc', 1200, G); L.box(1280, G, 70, 70, 'agar'); L.bug('crab', 1360, G); L.box(1440, G, 70, 70, 'agar');
      L.box(1280, G - 70, 420, 20, 'glass');
      const r2 = G - 90;
      L.box(1150, r2, 70, 70, 'agar'); L.bug('mrsa', 1230, r2); L.box(1310, r2, 70, 70, 'agar'); L.bug('ec', 1390, r2); L.box(1460, r2, 70, 70, 'agar');
      L.box(1300, r2 - 70, 400, 20, 'glass');
      const r3 = r2 - 90;
      L.box(1200, r3, 70, 70, 'agar'); L.bug('mdr', 1290, r3); L.box(1380, r3, 70, 70, 'agar');
      L.box(1290, r3 - 70, 260, 20, 'glass');
      L.flask(1290, r3 - 90, 100, 110);
      L.bug('vre', 1550, G);
  } }
];

/* ---------- State ---------- */
let engine, world, levelIndex = 0, level, score = 0, queue = [], qx = [], current = null, state = 'aim', paused = false;
let simTime = 0, armed = false, armAt = 0, flightTime = 0, calmSteps = 0, winAt = null, overlayAt = 0, stepCount = 0, growthEnd = 0;
let drag = null, loadAnim = null, fireAnim = null, springAnim = null, syrAng = ANG_REST, activePill = null, trail = [], shots = 0, stars = 0;
const removals = [], parts = [];
let buttons = [];

function makeBug(strain, x, bottom, parent) {
  const type = STRAINS[strain].sp, sp = SPECIES[type]; let b;
  if (sp.shape === 'circle') b = Bodies.circle(x, bottom - sp.r - 0.5, sp.r, { density: 0.001, friction: 1, frictionStatic: 3, restitution: 0.2, frictionAir: 0.02 });
  else b = Bodies.rectangle(x, bottom - sp.h / 2 - 0.5, sp.w, sp.h, { chamfer: { radius: Math.min(sp.w, sp.h) * 0.45 }, density: 0.0012, friction: 0.9, frictionStatic: 2, restitution: 0.15, frictionAir: 0.015 });
  b.plugin = {
    kind: 'bug', type, strain, hp: sp.hp, maxHp: sp.hp, flash: 0, smug: 0, squash: 0, blink: rand(1, 4), phase: rand(0, TAU),
    mut: parent ? { ...parent.mut } : {}, exp: {}, div: sp.gen, born: parent ? simTime : -9, resAt: -9,
    top: sp.shape === 'circle' ? sp.r : sp.h / 2
  };
  Composite.add(world, b);
  return b;
}

function buildLevel(def) {
  const L = {
    box(x, bottom, w, h, mat) {
      const m = MAT[mat];
      const b = Bodies.rectangle(x, bottom - h / 2 - 0.5, w, h, { density: m.density, friction: m.friction, frictionStatic: 1.2, restitution: m.restitution });
      const hp = m.hp * Math.sqrt(w * h / 4900);
      b.plugin = { kind: 'block', mat, w, h, hp, maxHp: hp, seed: (Math.random() * 1e9) | 0 };
      Composite.add(world, b);
    },
    flask(x, bottom, w, h) {
      const s = 0.55, t = (1 - s) * w, cy = h * (w + 2 * t) / (3 * (w + t));
      const b = Bodies.trapezoid(x, bottom - cy - 0.5, w, h, s, { density: MAT.glass.density, friction: 0.5, restitution: 0.08 });
      const hp = MAT.glass.hp * 1.3;
      b.plugin = { kind: 'block', mat: 'glass', flask: true, w, h, hp, maxHp: hp, seed: (Math.random() * 1e9) | 0,
        local: b.vertices.map(v => ({ x: v.x - b.position.x, y: v.y - b.position.y })) };
      Composite.add(world, b);
    },
    bug(strain, x, bottom) { makeBug(strain, x, bottom, null); }
  };
  def.build(L);
}

function loadLevel(i) {
  levelIndex = (i + LEVELS.length) % LEVELS.length; level = LEVELS[levelIndex];
  engine = Engine.create({ positionIterations: 10, velocityIterations: 8 }); world = engine.world;
  const ground = Bodies.rectangle(W / 2, G + 60, W * 3, 120, { isStatic: true, friction: 1 }); ground.plugin = { kind: 'ground' };
  const wall = Bodies.rectangle(-40, 0, 80, H * 3, { isStatic: true }); wall.plugin = { kind: 'ground' };
  Composite.add(world, [ground, wall]);
  Events.on(engine, 'collisionStart', onCollide);
  simTime = 0; stepCount = 0;
  buildLevel(level);
  score = 0; queue = level.pills.slice(); qx = queue.map((_, k) => QX0 - k * QDX);
  current = null; activePill = null; trail = []; parts.length = 0; removals.length = 0;
  armed = false; armAt = 0.8; winAt = null; paused = false; drag = null; fireAnim = null; springAnim = null; syrAng = ANG_REST; shots = 0; stars = 0;
  canvas.classList.remove('dragging');
  nextPill();
}

/* syringe geometry helpers */
const toWorldS = (lx, ly = 0) => ({ x: PIV.x + Math.cos(syrAng) * lx - Math.sin(syrAng) * ly, y: PIV.y + Math.sin(syrAng) * lx + Math.cos(syrAng) * ly });
const tipPos = () => toWorldS(SY.tip);
const pillPos = () => toWorldS(SY.pillX);

function nextPill() {
  if (!queue.length) { current = null; return; }
  const t = queue[0];
  loadAnim = { t: 0, from: { x: qx[0], y: 776 - halfLen(t) } };
  current = queue.shift(); qx.shift();
  state = 'aim';
}
function swapIn(k) {
  if (state !== 'aim' || !current || loadAnim || paused || drag || k >= queue.length || queue[k] === current) return;
  const t = queue[k]; queue[k] = current; current = t;
  loadAnim = { t: 0, from: { x: qx[k], y: 776 - halfLen(t) }, swap: true };
  puff(qx[k], 750);
}

function makePill(type, x, y, sc) {
  const P = PILLS[type]; let b;
  if (P.shape === 'cap') b = Bodies.rectangle(x, y, P.w * sc, P.h * sc, { chamfer: { radius: P.h * sc * 0.48 }, density: P.density, friction: 0.6, restitution: 0.3, frictionAir: 0.003 });
  else b = Bodies.circle(x, y, P.r * sc, { density: P.density, friction: 0.6, restitution: 0.35, frictionAir: 0.003 });
  b.plugin = { kind: 'pill', type, scale: sc, hitAt: null, used: false };
  return b;
}

/* ---------- Susceptibility ---------- */
const eff = (b, drug) => (STRAINS[b.plugin.strain].sus[drug] ?? R) * (b.plugin.mut[drug] ?? 1);
const tier = e => e >= 0.6 ? 'S' : e >= 0.25 ? 'I' : 'R';
function resisted(b, rel) {
  const d = b.plugin;
  d.smug = 0.9;
  if (rel > 3 && simTime - d.resAt > 0.8) { d.resAt = simTime; popText('RESISTANT', b.position.x, b.position.y - d.top - 40, '#5b6770', 26); }
}
function dose(b, drug, amt, rel) {
  const e = eff(b, drug);
  amt *= e;
  if (e < 0.25) resisted(b, rel);
  else if (amt >= 0.5) b.plugin.exp[drug] = (b.plugin.exp[drug] || 0) + amt;
  return amt;
}

/* ---------- Damage ---------- */
function onCollide(e) {
  for (const pair of e.pairs) {
    const a = pair.bodyA.parent, b = pair.bodyB.parent;
    for (const [s, o] of [[a, b], [b, a]]) {
      if (s.plugin.kind === 'pill' && s.plugin.hitAt == null && o.plugin.kind !== 'pill') { s.plugin.hitAt = simTime; s.frictionAir = 0.02; }
    }
    if (!armed) continue;
    const rel = Math.hypot(a.velocity.x - b.velocity.x, a.velocity.y - b.velocity.y);
    if (rel < 1.6) continue;
    hurt(a, b, rel); hurt(b, a, rel);
  }
}
function hurt(s, o, rel) {
  const d = s.plugin;
  if (d.hp == null || d.dead) return;
  let f = o.isStatic ? 1 : Math.sqrt(o.mass / s.mass);
  f = clamp(f, 0.45, 2.6);
  let amt = (rel - 1.6) * f;
  if (o.plugin.kind === 'pill') { amt *= 1.15; if (d.kind === 'bug') amt = dose(s, o.plugin.type, amt, rel); }
  else if (d.kind === 'bug') amt *= PHYS;
  applyDamage(s, amt);
}
function applyDamage(s, amt) {
  const d = s.plugin;
  if (!armed || d.dead || amt <= 0) return;

/* ---------- Divide, mutate, resist ---------- */
