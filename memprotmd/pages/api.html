<article class="prose"><h1>The MemProtMD API</h1>
<p>The MemProtMD API connects the MemProtMD database to applications such
as this site. The API is free to use for any application, provided data
obtained through it is properly attributed.</p>
<p>We have provided a quick overview of API methods in a <a href="https://github.com/pstansfeld/mpm_api/" rel="noopener" target="_blank">github repository</a>.</p></article>
